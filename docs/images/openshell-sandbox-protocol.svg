<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" aria-labelledby="title desc" role="img" viewBox="0 0 1280 580"><title id="title">OpenShell Sandbox Protocol</title><desc id="desc">The trusted supervisor and the network-isolated OpenShell Sandbox share one mutually authenticated connection. Separate streams carry control, DNS, and each TCP connection. The agent reaches the supervisor only through the OpenShell Sandbox.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#579000" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.section{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569;letter-spacing:.08em}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.small,.tiny{font:500 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tiny{font:700 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.owned,.trusted{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5}.dark{fill:#1f2937;stroke:#111827;stroke-width:2}.flow,.line{fill:none}.line{stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.flow{stroke:#579000;stroke-width:3;marker-start:url(#arrow-green);marker-end:url(#arrow-green)}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}</style></defs><rect width="1280" height="580" fill="#fff" rx="20"/><text x="45" y="50" class="section">TRUSTED</text><text x="622" y="50" class="section" text-anchor="middle">OPENSHELL SANDBOX PROTOCOL</text><text x="925" y="50" class="section">SANDBOX · NETWORK ISOLATED</text><rect width="260" height="290" x="40" y="105" class="trusted" rx="16"/><text x="170" y="150" class="label" text-anchor="middle">Supervisor</text><text x="170" y="174" class="tiny" text-anchor="middle">POLICY AND EGRESS</text><text x="170" y="225" class="small" text-anchor="middle">Policy evaluation</text><text x="170" y="255" class="small" text-anchor="middle">Credential injection</text><text x="170" y="285" class="small" text-anchor="middle">DNS resolution</text><text x="170" y="315" class="small" text-anchor="middle">Upstream connections</text><line x1="75" x2="265" y1="340" y2="340" stroke="#bfdbfe" stroke-width="1.5"/><text x="170" y="370" class="small" text-anchor="middle">Holds the gateway session</text><rect width="320" height="440" x="920" y="70" fill="#fff" stroke="#76b900" stroke-dasharray="10 7" stroke-width="3" rx="18"/><rect width="270" height="290" x="945" y="105" class="owned" rx="14"/><text x="1080" y="150" class="label" text-anchor="middle">Sandbox</text><text x="1080" y="174" class="tiny" text-anchor="middle">PROCESS AND SYSCALL BOUNDARY</text><text x="1080" y="225" class="small" text-anchor="middle">Owns the agent process</text><text x="1080" y="255" class="small" text-anchor="middle">Identifies each program</text><text x="1080" y="285" class="small" text-anchor="middle">Intercepts TCP and DNS</text><text x="1080" y="315" class="small" text-anchor="middle">Freezes the agent on disconnect</text><rect width="270" height="62" x="945" y="425" class="dark" rx="14"/><text x="1080" y="453" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text><text x="1080" y="474" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">untrusted workload</text><path d="M1080 395 V425" class="line"/><path d="M300 150 H945" class="flow"/><path d="M300 215 H945" class="flow"/><path d="M300 280 H945" class="flow"/><path d="M300 345 H945" class="flow"/><rect width="520" height="48" x="360" y="126" class="lane" rx="12"/><text x="385" y="156" class="label">Control</text><text x="525" y="156" class="small">attach · confirm · start · exec · signals · health</text><rect width="520" height="48" x="360" y="191" class="lane" rx="12"/><text x="385" y="221" class="label">DNS</text><text x="525" y="221" class="small">query and mediated response</text><rect width="520" height="48" x="360" y="256" class="lane" rx="12"/><text x="385" y="286" class="label">TCP stream 1</text><text x="525" y="286" class="small">destination · program identity · bytes</text><rect width="520" height="48" x="360" y="321" class="lane" rx="12"/><text x="385" y="351" class="label">TCP stream N</text><text x="525" y="351" class="small">independent connection and backpressure</text><text x="622" y="405" class="tiny" text-anchor="middle">ONE MUTUALLY AUTHENTICATED HTTP/2 CONNECTION</text><text x="40" y="550" class="small">Transport: Unix socket (Docker, Podman), TCP (Kubernetes), or vsock (MicroVM). Authentication and protocol behavior stay the same.</text></svg>