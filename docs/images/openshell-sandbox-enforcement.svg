<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" aria-labelledby="title desc" role="img" viewBox="0 0 1280 420"><title id="title">OpenShell sandbox enforcement flow</title><desc id="desc">The sandbox workload and trusted supervisor are separate boundaries. All workload network egress is denied except the authenticated Sandbox Protocol connection to the supervisor. The OpenShell Sandbox holds a local policy.local file that carries proposed policy changes to the supervisor&apos;s policy enforcement for review, and receives the reloaded policy back.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#579000" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.section{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569;letter-spacing:.08em}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.small,.tiny{font:500 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tiny{font:700 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.step{font:700 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#fff}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.green,.owned,.trusted{fill:#f2f9e8;stroke:#76b900;stroke-width:2.5}.owned,.trusted{fill:#eff6ff;stroke:#3b82f6}.dark{fill:#1f2937;stroke:#111827;stroke-width:2}.flow{fill:none;stroke:#579000;stroke-width:3;marker-end:url(#arrow-green)}.blocked,.policy{fill:none;stroke:#c2413b;stroke-width:2.5;stroke-dasharray:8 7}.policy{stroke:#475569;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}.chip{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}</style></defs><rect width="1280" height="420" fill="#fff" rx="20"/><g transform="translate(0,-50)"><text x="45" y="100" class="section">SANDBOX · NETWORK ISOLATED</text><rect width="360" height="310" x="40" y="120" fill="#fff" stroke="#76b900" stroke-dasharray="10 7" stroke-width="3" rx="18"/><text x="65" y="150" class="tiny">CONTAINER · VM</text><rect width="125" height="94" x="75" y="205" class="dark" rx="14"/><text x="137" y="245" text-anchor="middle" style="font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text><text x="137" y="270" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">process</text><rect width="130" height="124" x="240" y="190" class="owned" rx="14"/><text x="305" y="222" class="label" text-anchor="middle">OpenShell</text><text x="305" y="244" class="label" text-anchor="middle">Sandbox</text><text x="305" y="264" class="small" text-anchor="middle">process owner</text><rect width="104" height="24" x="253" y="278" class="chip" rx="6"/><text x="305" y="294" class="tiny" text-anchor="middle">policy.local</text><path d="M200 252 H240" class="flow"/><circle cx="220" cy="228" r="13" fill="#579000"/><text x="220" y="233" class="step" text-anchor="middle">1</text><text x="305" y="340" class="small" text-anchor="middle">TCP or DNS request</text><text x="305" y="360" class="small" text-anchor="middle">Identifies the program</text><path d="M137 299 V421" class="blocked"/><line x1="128" x2="146" y1="421" y2="439" stroke="#c2413b" stroke-width="3"/><line x1="146" x2="128" y1="421" y2="439" stroke="#c2413b" stroke-width="3"/><text x="160" y="410" class="tiny">ALL OTHER EGRESS DENIED</text><text x="525" y="190" class="tiny" text-anchor="middle">ONLY ALLOWED EGRESS</text><text x="525" y="215" class="label" text-anchor="middle">Sandbox Protocol</text><text x="525" y="238" class="small" text-anchor="middle">Unix socket · TCP · vsock</text><path d="M370 252 H680" class="flow"/><circle cx="525" cy="252" r="13" fill="#579000"/><text x="525" y="257" class="step" text-anchor="middle">2</text><text x="655" y="100" class="section">SUPERVISOR · TRUSTED</text><rect width="390" height="310" x="650" y="120" class="trusted" rx="18"/><rect width="150" height="124" x="680" y="190" class="green" rx="14"/><text x="755" y="230" class="label" text-anchor="middle">Isolation</text><text x="755" y="254" class="label" text-anchor="middle">backend</text><text x="755" y="282" class="small" text-anchor="middle">verifies boundary</text><rect width="150" height="124" x="860" y="190" class="box" rx="14"/><text x="935" y="230" class="label" text-anchor="middle">Policy</text><text x="935" y="254" class="label" text-anchor="middle">enforcement</text><text x="935" y="282" class="small" text-anchor="middle">policy · credentials</text><path d="M830 252 H860" class="flow"/><circle cx="845" cy="228" r="13" fill="#579000"/><text x="845" y="233" class="step" text-anchor="middle">3</text><text x="755" y="360" class="small" text-anchor="middle">Receives request with</text><text x="755" y="381" class="small" text-anchor="middle">trusted process identity</text><text x="935" y="360" class="small" text-anchor="middle">Checks destination, binary,</text><text x="935" y="381" class="small" text-anchor="middle">L7 rules, and credentials</text><path d="M357 290 H410 V170 H935 V190" class="policy"/><text x="670" y="163" class="tiny" text-anchor="middle">POLICY.LOCAL PROPOSE / RELOAD (ASYNC)</text><rect width="160" height="124" x="1080" y="190" class="box" rx="14"/><text x="1160" y="230" class="label" text-anchor="middle">Upstream</text><text x="1160" y="254" class="label" text-anchor="middle">service</text><text x="1160" y="282" class="small" text-anchor="middle">approved connection</text><path d="M1010 252 H1080" class="flow"/><circle cx="1045" cy="228" r="13" fill="#579000"/><text x="1045" y="233" class="step" text-anchor="middle">4</text></g></svg>