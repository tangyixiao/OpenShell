<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1200 680"><title id="title">OpenShell runtime on Kubernetes</title><desc id="desc">The gateway creates an Agent Sandbox custom resource and a separate supervisor Pod. The Agent Sandbox controller creates the workload Pod. A NetworkPolicy denies workload-initiated egress and admits only supervisor traffic to the workload&apos;s boundary Service. The supervisor initiates an authenticated TLS channel, evaluates agent requests, and opens policy-approved upstream connections.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#579000" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.section{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569;letter-spacing:.08em}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.small,.tiny{font:500 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tiny{font:700 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.box,.soft{fill:#fff;stroke:#cbd5e1;stroke-width:2}.soft{fill:#f8fafc}.green,.owned,.trusted{stroke-width:2.5}.owned,.trusted{fill:#eff6ff;stroke:#3b82f6}.green{fill:#f2f9e8;stroke:#76b900}.dark{fill:#1f2937;stroke:#111827;stroke-width:2}.flow,.line{fill:none}.line{stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.flow{stroke:#579000;stroke-width:3;marker-end:url(#arrow-green)}.blocked{fill:none;stroke:#c2413b;stroke-width:2.5;stroke-dasharray:8 7}</style></defs><rect width="1200" height="680" fill="#fff" rx="20"/><g transform="translate(0,-90)"><text x="45" y="305" class="section">GATEWAY</text><rect width="280" height="240" x="40" y="320" class="soft" rx="18"/><rect width="230" height="82" x="65" y="350" class="trusted" rx="14"/><text x="180" y="384" class="label" text-anchor="middle">API Server</text><text x="180" y="409" class="small" text-anchor="middle">Deployment or StatefulSet</text><rect width="230" height="72" x="65" y="465" class="green" rx="14"/><text x="180" y="495" class="label" text-anchor="middle">Compute driver</text><text x="180" y="519" class="small" text-anchor="middle">provisions resources</text><path d="M180 432 V465" class="line"/><rect width="220" height="94" x="415" y="145" class="box" rx="14"/><text x="525" y="180" class="label" text-anchor="middle">Sandbox CR</text><text x="525" y="204" class="small" text-anchor="middle">Agent Sandbox API</text><text x="525" y="225" class="small" text-anchor="middle">controller creates Pod</text><rect width="220" height="94" x="665" y="145" class="green" rx="14"/><text x="775" y="180" class="label" text-anchor="middle">NetworkPolicy</text><text x="775" y="204" class="small" text-anchor="middle">no workload egress</text><text x="775" y="225" class="small" text-anchor="middle">supervisor ingress only</text><rect width="235" height="94" x="915" y="145" class="box" rx="14"/><text x="1032" y="180" class="label" text-anchor="middle">Workspace PVC</text><text x="1032" y="207" class="small" text-anchor="middle">/sandbox persists</text><rect width="280" height="280" x="415" y="330" class="trusted" rx="18"/><text x="440" y="360" class="tiny">SUPERVISOR POD</text><rect width="230" height="164" x="440" y="385" class="box" rx="14"/><text x="555" y="422" class="label" text-anchor="middle">Supervisor</text><text x="555" y="457" class="small" text-anchor="middle">Policy evaluation</text><text x="555" y="485" class="small" text-anchor="middle">Credentials and proxying</text><text x="555" y="513" class="small" text-anchor="middle">Gateway session</text><text x="440" y="580" class="tiny">DIRECTLY MANAGED</text><text x="440" y="597" class="tiny">BY OPENSHELL</text><rect width="275" height="280" x="875" y="330" fill="#fff" stroke="#76b900" stroke-dasharray="10 7" stroke-width="3" rx="18"/><text x="900" y="360" class="tiny">WORKLOAD POD</text><rect width="225" height="78" x="900" y="385" class="owned" rx="13"/><text x="1012" y="417" class="label" text-anchor="middle">OpenShell Sandbox</text><text x="1012" y="443" class="small" text-anchor="middle">process and syscall boundary</text><path d="M1012 463 V493" class="line"/><rect width="225" height="76" x="900" y="493" class="dark" rx="13"/><text x="1012" y="524" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text><text x="1012" y="548" text-anchor="middle" style="font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">untrusted workload</text><text x="1012" y="592" class="tiny" text-anchor="middle">AGENT SANDBOX CONTROLLER POD</text><text x="785" y="376" class="tiny" text-anchor="middle">SUPERVISOR DIALS</text><text x="785" y="394" class="tiny" text-anchor="middle">TLS CHANNEL</text><rect width="120" height="96" x="725" y="408" class="box" rx="14"/><text x="785" y="443" class="label" text-anchor="middle">Service</text><text x="785" y="468" class="small" text-anchor="middle">TLS · 5500</text><text x="785" y="488" class="small" text-anchor="middle">boundary</text><path d="M695 456 H725" class="flow"/><path d="M845 456 H875" class="flow"/><text x="785" y="539" class="small" text-anchor="middle">Agent requests return</text><text x="785" y="560" class="small" text-anchor="middle">on this channel</text><path d="M295 501 H350 V192 H415" class="line"/><text x="355" y="177" class="tiny" text-anchor="middle">K8S API</text><path d="M415 562 H320" class="line"/><text x="367" y="529" class="tiny" text-anchor="middle">OUTBOUND</text><text x="367" y="547" class="tiny" text-anchor="middle">SESSION</text><rect width="220" height="80" x="445" y="660" class="soft" rx="16"/><text x="555" y="693" class="label" text-anchor="middle">External services</text><text x="555" y="719" class="small" text-anchor="middle">APIs · tools · models</text><path d="M630 549 V660" class="flow"/><text x="642" y="640" class="tiny">POLICY-APPROVED EGRESS</text><path d="M1012 610 V638" class="blocked"/><line x1="1002" x2="1022" y1="640" y2="660" stroke="#c2413b" stroke-width="3"/><line x1="1022" x2="1002" y1="640" y2="660" stroke="#c2413b" stroke-width="3"/><text x="1012" y="685" class="tiny" text-anchor="middle">NO WORKLOAD-INITIATED EGRESS</text></g></svg>