<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="395" aria-labelledby="title desc" role="img" viewBox="0 0 1220 395"><title id="title">OpenShell extension points</title><desc id="desc">Two rows read left to right. Data plane: the sandboxed agent reaches the supervisor through the isolation backend, and supervisor middleware processes requests before they reach models and APIs. Control plane: you reach the gateway through interceptors, and gateway drivers connect it to runtimes and secret stores.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#579000" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.section{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569;letter-spacing:.08em}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.small{font:500 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tag{font:700 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#579000;letter-spacing:.06em}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.extension,.trusted{stroke-width:2.5}.trusted{fill:#eff6ff;stroke:#3b82f6}.extension{fill:#f2f9e8;stroke:#76b900}.dark{fill:#1f2937;stroke:#111827;stroke-width:2}.flow,.line{fill:none}.line{stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.flow{stroke:#579000;stroke-width:3;marker-end:url(#arrow-green)}</style></defs><rect width="1220" height="395" fill="#fff" rx="20"/><text x="30" y="41" class="section">DATA PLANE</text><rect width="180" height="90" x="30" y="70" class="dark" rx="14"/><text x="120" y="112" class="label" text-anchor="middle" style="fill:#fff">Agent</text><text x="120" y="136" class="small" text-anchor="middle" style="fill:#d1d5db">sandboxed workload</text><rect width="200" height="90" x="250" y="70" class="extension" rx="15"/><text x="350" y="96" class="tag" text-anchor="middle">EXTENSION POINT</text><text x="350" y="123" class="label" text-anchor="middle">Isolation backend</text><text x="350" y="145" class="small" text-anchor="middle">launch · exec · mediate</text><rect width="430" height="120" x="490" y="55" class="trusted" rx="18"/><text x="510" y="112" class="label">Supervisor</text><text x="510" y="136" class="small">policy · credentials</text><rect width="210" height="90" x="690" y="70" class="extension" rx="15"/><text x="795" y="96" class="tag" text-anchor="middle">EXTENSION POINT</text><text x="795" y="123" class="label" text-anchor="middle">Middleware</text><text x="795" y="145" class="small" text-anchor="middle">inspect · transform · deny</text><rect width="220" height="90" x="970" y="70" class="box" rx="14"/><text x="1080" y="112" class="label" text-anchor="middle">Models, APIs</text><text x="1080" y="136" class="small" text-anchor="middle">external services</text><path d="M210 115 H248" class="line"/><path d="M450 115 H488" class="line"/><path d="M650 115 H688" class="line"/><path d="M900 115 H968" class="flow"/><text x="30" y="231" class="section">CONTROL PLANE</text><rect width="180" height="90" x="30" y="260" class="box" rx="14"/><text x="120" y="302" class="label" text-anchor="middle">You</text><text x="120" y="326" class="small" text-anchor="middle">CLI · SDK · TUI</text><rect width="200" height="90" x="250" y="260" class="extension" rx="15"/><text x="350" y="286" class="tag" text-anchor="middle">EXTENSION POINT</text><text x="350" y="313" class="label" text-anchor="middle">Interceptors</text><text x="350" y="335" class="small" text-anchor="middle">modify · validate · observe</text><rect width="430" height="120" x="490" y="245" class="trusted" rx="18"/><text x="510" y="302" class="label">Gateway</text><text x="510" y="326" class="small">auth · state · API</text><rect width="210" height="90" x="690" y="260" class="extension" rx="15"/><text x="795" y="286" class="tag" text-anchor="middle">EXTENSION POINT</text><text x="795" y="313" class="label" text-anchor="middle">Drivers</text><text x="795" y="335" class="small" text-anchor="middle">compute · credentials</text><rect width="220" height="90" x="970" y="260" class="box" rx="14"/><text x="1080" y="302" class="label" text-anchor="middle">Infrastructure</text><text x="1080" y="326" class="small" text-anchor="middle">runtimes · secret stores</text><path d="M210 305 H248" class="line"/><path d="M450 305 H488" class="line"/><path d="M650 305 H688" class="line"/><path d="M900 305 H968" class="line"/></svg>